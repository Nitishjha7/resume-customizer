# Builds the backend image and deploys it to Cloud Run (backend/ holds the Dockerfile)
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/resume-customizer/resume-api

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${COMMIT_SHA}", "-f", "backend/Dockerfile", "backend"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${COMMIT_SHA}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - resume-api
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=asia-south1
      - --allow-unauthenticated
      - --quiet

images:
  - ${_IMAGE}:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
